<!doctype html>
<!-- GHT (default; ?classic=1 = GHT Classic): play live against the bot (owner: sonnet, Playable Client).
     Open play/index.html from the repo-root server. Query: ?ai=sonnet|haiku|fable|sample  ?seed=7  ?ticks=21600  ?quality=low  ?mute=1
     Mouse: drag = box select (12 max), click, double-click = all of that kind, right-click = smart command (move / attack / mine / rally),
            wheel = zoom, screen edges or arrows = scroll, minimap click = move camera, minimap right-click = command.
     Keys:  the card is 5 x 3 with each key printed on its button: Q move, W stop, E hold, R patrol, T attack-move (then click for
            the last three), A/S/D/F/G/Z/X/C/V/B the rest, ` mute. ?keys=classic (or localStorage keys=classic) prints the old letters
            (M, S, H, P, A, then I W T F L X V N D). Shift = queue, building keys then click to place
            (green = ok, red = blocked), training keys on a selected building (shown on the buttons), rally then click,
            Ctrl+1..9 make a group, 1..9 recall (twice = centre), Space = last alert, P pause, Esc cancel, + / - zoom. -->

<body>
<div id="root"></div>
<script type="module">
import * as THREE from 'three';
import { createEngine, createPlaceholder } from '../viewer3d/engine.mjs';
import { startGame } from './app.mjs';
import { watchEditions } from './edition.mjs';
watchEditions(window); // new green build -> "Edition N: ..." for 3 s, then reload; ?edition=off to disable
const root = document.getElementById('root');
try {
  await startGame({ THREE, createEngine, createPlaceholder, root, query: new URLSearchParams(location.search) });
} catch (err) {
  console.error(err);
  const boot = root.querySelector('#boot') ?? root;
  boot.hidden = false; boot.classList.add('error');
  boot.innerHTML = `<b>GHOSTIES, TOASTIES & BROSKIES</b><br>could not start<br><small>${String(err?.message ?? err)}</small>`;
}
</script>
